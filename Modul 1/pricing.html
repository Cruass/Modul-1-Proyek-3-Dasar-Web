
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilihan Paket Lokakarya</title>

    <link rel="stylesheet" href="css/pricing.css">
</head>
<body>

    <main>
        <h1>Pilihan Paket Lokakarya</h1>

        <div class="pricing-container">

            <article class="price-card">
                <h2>Mandiri</h2>
                <p class="price">Gratis</p>

                <ul>
                    <li>Materi dasar</li>
                    <li>Latihan mandiri</li>
                </ul>

                <a href="#daftar" class="button">Pilih paket</a>
            </article>

            <article class="price-card price-card--featured">
                <p class="badge">Rekomendasi</p>
                <h2>Terbimbing</h2>
                <p class="price">Rp150.000</p>

                <ul>
                    <li>Materi dasar</li>
                    <li>Review tugas</li>
                    <li>Code defense</li>
                </ul>

                <a href="#daftar" class="button">Pilih paket</a>
            </article>

            <article class="price-card">
                <h2>Intensif</h2>
                <p class="price">Rp250.000</p>

                <ul>
                    <li>Semua fasilitas</li>
                    <li>Konsultasi tambahan</li>
                </ul>

                <a href="#daftar" class="button">Pilih paket</a>
            </article>

        </div>
    </main>

</body>
</html>
